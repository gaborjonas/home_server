---
- name: Create Traefik directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ apps_root }}/traefik"
    - "{{ apps_root }}/traefik/dynamic"

- name: Render Traefik Docker Compose file
  ansible.builtin.template:
    src: "compose.yml.j2"
    dest: "{{ apps_root }}/traefik/compose.yml"
    mode: "0644"
  notify: Restart Traefik container

- name: Ensure Traefik container is running
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/traefik"
    state: present
