---
- name: Create AdGuard Home directory
  ansible.builtin.file:
    path: "{{ apps_root }}/adguard"
    state: directory
    mode: "0755"

- name: Render AdGuard Home Docker Compose file
  ansible.builtin.template:
    src: "compose.yml.j2"
    dest: "{{ apps_root }}/adguard/compose.yml"
    mode: "0644"
  notify: Restart AdGuard Home container

- name: Ensure AdGuard Home container is running
  community.docker.docker_compose_v2:
    project_src: "{{ apps_root }}/adguard"
    state: present
